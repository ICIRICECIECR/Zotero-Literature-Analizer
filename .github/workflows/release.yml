name: Release Zotero Plugin

on:
  push:
    tags:
      - 'v*'  # 只有 v1.0.0, v2.1.3 这样的 tag 才触发
  workflow_dispatch:  # 网页上手动点 Run workflow 也能触发
    inputs:
      tag:
        description: 'Tag 名称（例如 v1.0.1），用于自动创建 Release'
        required: true
        default: 'v1.0.2'

permissions:
  contents: write  # 需要写 Release 权限

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: 🔍 Checkout code
        uses: actions/checkout@v4

      - name: 📖 Read manifest version
        id: version
        run: |
          VERSION=$(python3 -c "import json; print(json.load(open('manifest.json'))['version'])")
          XPI_NAME="trae-lit-interp-${VERSION}.xpi"
          # 兼容两种触发方式：push tag 用 GITHUB_REF_NAME，手动触发用 inputs.tag
          if [ -n "${{ github.event.inputs.tag }}" ]; then
            TAG="${{ github.event.inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "xpi_name=${XPI_NAME}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG}" >> "$GITHUB_OUTPUT"
          echo "Version: ${VERSION}, Tag: ${TAG}, XPI: ${XPI_NAME}"

      - name: 📦 Build XPI (ZIP)
        run: |
          cd "${{ github.workspace }}"
          # 把 XPI 看作 ZIP 文件，直接打包所有源码（排除 .git 等）
          zip -r "${{ steps.version.outputs.xpi_name }}" \
            manifest.json \
            bootstrap.js \
            prefs.js \
            update.json \
            icons/ \
            scripts/ \
            CHANGELOG.md \
            LICENSE \
            README.md \
            .gitignore \
            -x "*.DS_Store"
          ls -la "${{ steps.version.outputs.xpi_name }}"

      - name: 🔐 Compute SHA256 hash
        id: hash
        run: |
          HASH=$(sha256sum "${{ steps.version.outputs.xpi_name }}" | awk '{print $1}')
          echo "hash=${HASH}" >> "$GITHUB_OUTPUT"
          echo "SHA256: ${HASH}"

      - name: ✏️ Update update.json
        run: |
          python3 << 'PYEOF'
          import json, os

          version = os.environ["VERSION"]
          tag = os.environ["TAG"]
          xpi_name = os.environ["XPI_NAME"]
          hash_val = os.environ["HASH"]
          url = os.environ["URL"]

          with open("update.json") as f:
            data = json.load(f)

          updates = data["addons"]["trae-lit-interp@example.com"]["updates"]

          # 检查有没有重复版本
          existing = [u for u in updates if u["version"] == version]
          for old in existing:
            updates.remove(old)

          # 新版本插到最前面
          new_entry = {
            "version": version,
            "update_link": f"https://github.com/{url}/releases/download/{tag}/{xpi_name}",
            "update_hash": f"sha256:{hash_val}",
            "applications": {
              "zotero": {
                "strict_min_version": "7.0",
                "strict_max_version": "10.*"
              }
            }
          }
          updates.insert(0, new_entry)

          with open("update.json", "w") as f:
            json.dump(data, f, indent=2, ensure_ascii=False)
            f.write("\n")

          print(f"update.json updated for v{version}")
          print(f"update_link: {new_entry['update_link']}")
          print(f"update_hash: {new_entry['update_hash']}")
          PYEOF
        env:
          VERSION: ${{ steps.version.outputs.version }}
          TAG: ${{ steps.version.outputs.tag }}
          XPI_NAME: ${{ steps.version.outputs.xpi_name }}
          HASH: ${{ steps.hash.outputs.hash }}
          URL: ${{ github.repository }}

      - name: 📤 Commit update.json
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add update.json
          git commit -m "chore: update update.json for release ${{ steps.version.outputs.tag }}" || true
          git push origin HEAD:main

      - name: 🚀 Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: v${{ steps.version.outputs.version }} — ${{ steps.version.outputs.tag }}
          body: |
            ## 📚 Trae Literature Interpretation v${{ steps.version.outputs.version }}

            > Zotero 7+ 插件：一键生成 10 板块结构化文献解读 HTML 报告

            ### 🔑 安装方法
            1. 下载下方 `${{ steps.version.outputs.xpi_name }}`
            2. Zotero → 工具 → 附加组件 (Ctrl+Shift+A)
            3. 齿轮 → 从文件安装附加组件 → 选择 xpi
            4. 重启 Zotero

            ### 📦 SHA256
            ```
            ${{ steps.hash.outputs.hash }}
            ```
          files: |
            ${{ steps.version.outputs.xpi_name }}
            update.json
          draft: false
          prerelease: false
          generate_release_notes: true
